<div class="page-enter">
  <div class="page-heading">
    <div><span class="eyebrow">PLAN YOUR NEXT STEP</span>
      <h1>Calendar</h1>
      <p>Keep interviews, assessments, and follow-ups in sight.</p>
    </div><button class="btn btn-primary" data-action="add"><i
        data-icon="plus"></i> Add event</button>
  </div>
  <div class="calendar-layout">
    <section class="panel calendar-panel">
      <div class="calendar-toolbar"><button class="icon-btn"
          data-calendar="prev"><i data-icon="chevron-left"></i></button>
        <h3 id="calendar-month"></h3><button class="icon-btn"
          data-calendar="next"><i data-icon="chevron-right"></i></button><button
          class="btn btn-soft btn-small" data-calendar="today">Today</button>
      </div>
      <div class="calendar-grid" id="calendar-grid"></div>
    </section>
    <aside class="panel agenda-panel"><span class="eyebrow">UPCOMING</span>
      <h3>Agenda</h3>
      <div id="calendar-agenda"></div>
    </aside>
  </div>
</div>
