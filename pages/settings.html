<div class="page-enter">
   <div class="page-heading">
      <div><span class="eyebrow">MAKE JOBTRACK YOURS</span>
         <h1>Settings</h1>
         <p>Manage your profile, appearance, and workspace preferences.</p>
      </div>
   </div>
   <div class="settings-layout">
      <section class="panel settings-card">
         <div class="section-heading">
            <div><span class="eyebrow">PERSONAL PROFILE</span>
               <h3>Profile information</h3>
            </div>
            <div class="settings-icon"><i data-icon="user-round"></i></div>
         </div><label class="field"><span>Display name</span><input id="settings-name" placeholder="Your name"></label><label class="field"><span>Email
               address</span><input id="settings-email" disabled></label>
         <div class="settings-actions"><button class="btn btn-primary" data-action="save-profile">Save changes</button></div>
      </section>
      <section class="panel settings-card">
         <div class="section-heading">
            <div><span class="eyebrow">APPEARANCE</span>
               <h3>Theme preferences</h3>
            </div>
            <div class="settings-icon"><i data-icon="palette"></i></div>
         </div>
         <div class="theme-options"><button data-theme-choice="light"><span class="theme-preview light-preview"></span><b>Light</b><small>Bright and
                  clean</small></button><button data-theme-choice="dark"><span class="theme-preview dark-preview"></span><b>Dark</b><small>Easy on the
                  eyes</small></button><button data-theme-choice="system"><span class="theme-preview system-preview"></span><b>System</b><small>Follow
                  device</small></button></div>
      </section>
      <section class="panel settings-card">
         <div class="section-heading">
            <div><span class="eyebrow">YOUR DATA</span>
               <h3>Data & account</h3>
            </div>
            <div class="settings-icon"><i data-icon="database"></i></div>
         </div>
         <p class="muted-copy">Your applications are stored securely in your Firebase account.</p>
         <div class="settings-actions wrap"><button class="btn btn-soft" data-action="export"><i data-icon="download"></i> Export CSV</button><button
               class="btn btn-soft" data-action="reset-password"><i data-icon="key-round"></i> Reset password</button><button class="btn btn-danger"
               data-action="signout"><i data-icon="log-out"></i> Sign out</button></div>
      </section>
   </div>
</div>
